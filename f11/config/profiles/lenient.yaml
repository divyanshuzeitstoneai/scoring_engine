# Lenient Profile: Permissive estimation mode.
# Allows lower COGS coverage, aggressive rate card fallbacks, and wider bands.
api_version: "2024-10"
as_of: "2026-09-30T23:59:59Z"
shop_currency: "USD"
currency_exponent: 2
money_basis: "shopMoney"

refund_window_days:
  Apparel: 14
  Footwear: 14
  Electronics: 7
  Home Goods: 14
  Beauty: 7
  Digital: 0
  Default: 14

window_start_event: "processedAt"

refund_provision_rate:
  Apparel: 0.08
  Footwear: 0.05
  Electronics: 0.02
  Home Goods: 0.02
  Beauty: 0.01
  Digital: 0.00
  Default: 0.03

discount_proration_policy: "pro_rata"
rounding_mode: "half_up"

custom_line_cost_policy: "missing"
bundle_policy: "component_explosion_or_missing"
tips_policy: "exclude_from_merchandise_revenue"

carrier_cost_source: "metafield:custom.actual_carrier_cost"
shipping_rate_card:
  default_zone:
    base_cost: 600
    per_kg: 100
  domestic:
    base_cost: 450
    per_kg: 80
  international:
    base_cost: 1200
    per_kg: 200

structural_zero_shipping_rules:
  - "no_line_requires_shipping"
  - "local_pickup"
  - "pos_in_person"
  - "digital_fulfillment"

zero_fee_gateways:
  - "manual"
  - "cash_on_delivery"
  - "bank_deposit"
  - "custom"

gateway_fee_schedule:
  shopify_payments:
    rate: 0.00
    fixed: 0
  paypal:
    rate: 0.029
    fixed: 30
  stripe:
    rate: 0.029
    fixed: 30
  razorpay:
    rate: 0.020
    fixed: 0
  klarna:
    rate: 0.0329
    fixed: 30

gateway_fee_refund_treatment: "full_refund_of_fees"
packaging_cost: 100

cogs_coverage_gate: 70.0
suspect_zero_cost_policy: "measured_with_flag"

band_thresholds:
  high: 25.0
  acceptable: 8.0
  at_risk: 0.0

excluded_financial_statuses:
  - "VOIDED"

cancelled_after_fulfillment_policy: "include_with_refunds"
test_order_policy: "exclude"
