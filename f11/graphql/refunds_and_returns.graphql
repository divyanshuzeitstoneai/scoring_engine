# =============================================================================
# Purpose: Extract refunds, return lines, and restock policies
# Required Scopes: read_orders [V-DOC]
# Cost Estimate: 5 points
# Pinned Version: 2024-10
# Verification Label: [V-DOC]
# =============================================================================

query GetRefundsAndReturns($orderId: ID!) {
  order(id: $orderId) {
    id
    refunds(first: 20) {
      id
      createdAt
      note
      totalRefundedSet {
        shopMoney { amount currencyCode }
      }
      refundLineItems(first: 50) {
        edges {
          node {
            quantity
            restockType
            subtotalSet { shopMoney { amount currencyCode } }
            lineItem {
              id
              sku
            }
          }
        }
      }
    }
  }
}
